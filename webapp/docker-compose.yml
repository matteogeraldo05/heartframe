# docker compose up -d --build     (run from this folder on the home server)
# Deployed on CasaOS behind a Cloudflare Tunnel (no Tailscale). See README "Deployment".
services:
  heartframe:
    build: .
    image: heartframe-web:local
    container_name: heartframe
    restart: unless-stopped
    # Public DNS for the container. Without this the container inherits the host's
    # resolver, and if that is Tailscale MagicDNS (100.100.100.100) GitHub lookups
    # fail with EAI_AGAIN and every publish logs "fetch failed".
    dns: [1.1.1.1, 9.9.9.9]
    # Host port 5683 -> container 8080. The Cloudflare Tunnel points at
    # http://localhost:5683. If cloudflared runs with host networking you can
    # tighten this to "127.0.0.1:5683:8080" so the LAN can't reach plain HTTP.
    ports:
      - "5683:8080"
    environment:
      GITHUB_OWNER: "matteogeraldo05"
      GITHUB_REPO: "heartframe-messages"       # <-- the PRIVATE messages repo
      GITHUB_BRANCH: "main"
      COOKIE_SECURE: "true"                    # Cloudflare serves HTTPS; set "false" only to log in over plain http://<LAN-IP>:5683
      # REQUIRE_TAILSCALE_LOGIN: "you@github"  # Tailscale Serve only; not used with Cloudflare Tunnel
    secrets:
      - github_token
      - message_key
      - admin_password_hash
      # - ota_public_key                     # optional (OTA, M8): pre-checks firmware signatures
    volumes:
      - ./data:/data
    # Hardening: read-only root filesystem, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    mem_limit: 384m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

secrets:
  github_token:
    file: ./secrets/github_token
  message_key:
    file: ./secrets/message_key
  admin_password_hash:
    file: ./secrets/admin_password_hash
  # ota_public_key:
  #   file: ./secrets/ota_public_key
